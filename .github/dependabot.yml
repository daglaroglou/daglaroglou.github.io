version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - dependencies
    ignore:
      # TypeScript 7 is not yet supported by typescript-eslint 8.x
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # Group minor and patch updates for automatic CI and automerge
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        patterns:
          - "*"
