name: Dependabot CI + Auto-merge

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

# One run per PR; supersede older runs when the branch updates.
concurrency:
  group: dependabot-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependabot-ci:
    if: >-
      github.actor == 'dependabot[bot]' &&
      startsWith(github.head_ref, 'dependabot/npm_and_yarn/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout Dependabot PR
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          check-latest: true
          cache: "npm"
          cache-dependency-path: package-lock.json

      # Dependabot grouped updates can produce lockfiles that npm's strict peer
      # resolver rejects (e.g. eslint major vs plugin peer ranges). Legacy peer
      # resolution matches typical local `npm install` behavior and avoids false
      # CI failures on otherwise installable trees.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: true
          CI: true

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build --if-present

  enable-automerge:
    if: >-
      github.actor == 'dependabot[bot]' &&
      startsWith(github.head_ref, 'dependabot/npm_and_yarn/')
    needs: dependabot-ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: squash

  # GitHub Actions dependency PRs do not touch package.json; skip npm CI but
  # still enable auto-merge when branch protection allows it.
  enable-automerge-github-actions:
    if: >-
      github.actor == 'dependabot[bot]' &&
      startsWith(github.head_ref, 'dependabot/github_actions/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: squash
