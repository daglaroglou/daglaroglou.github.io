name: Update University Grades

on:
  schedule:
    # Run on the 1st of every month at 8:00 AM UTC
    - cron: '0 8 1 * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  actions: write

jobs:
  update-grades:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4
          
      - name: Run grades scraper
        env:
          USERNAME: ${{ secrets.UNI_USERNAME }}
          PASSWORD: ${{ secrets.UNI_PASSWORD }}
        run: |
          cd .github/workflows
          python ylida.py
          
      - name: Check if grades changed
        id: check_changes
        run: |
          if git diff --quiet src/data/grades.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
          
      - name: Commit and push if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/grades.json
          git commit -m "Update university grades"
          git push
          
      - name: Trigger deployment
        if: steps.check_changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy.yml

